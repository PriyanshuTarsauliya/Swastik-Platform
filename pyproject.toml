[project]
name = "live-dj"
version = "0.1.0"
description = "A live voice DJ powered by the Gemini Live API — EP1 of the Multimodal Agents Cookbook."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.20",
    "python-dotenv>=1.0",
    "websockets>=13",
    "twilio>=9.11.1",
    "qrcode[pil]>=8.2",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "psycopg2-binary>=2.9.9",
]

[tool.uv]
package = false
