databases:
  - name: swastik-db
    databaseName: swastik_db_o0vc
    user: swastik_db_o0vc_user
    plan: free
    region: ohio

services:
  - type: web
    name: swastik-voice-agent
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swastik-db
          property: connectionString
      - key: PORT
        value: "8000"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "FALSE"
      - key: LIVE_MODEL
        value: "gemini-3.1-flash-live-preview"
      - key: LIVE_VOICE
        value: "Aoede"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_CONTENT_SID
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_PAYEE_NAME
        sync: false
