<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Obsidian Gradient -->
    <radialGradient id="sBg" cx="50%" cy="50%" r="50%" fx="40%" fy="35%">
      <stop offset="0%" stop-color="#0F1E36"/>
      <stop offset="60%" stop-color="#060C18"/>
      <stop offset="100%" stop-color="#02050B"/>
    </radialGradient>

    <!-- Master Cyan -> Teal -> Amber Gradient -->
    <linearGradient id="sGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#00D2FF"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Accent Golden Cyan Gradient -->
    <linearGradient id="sGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Luxury Circular Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#sBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#14C8B2" stroke-width="3" opacity="0.8"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.4"/>

  <!-- 2. The Iconic "S" Voice Wave -->
  <g filter="url(#sShadow)">
    <!-- Main S Ribbon (True S geometry: top-right -> top-left -> center -> bottom-right -> bottom-left) -->
    <path d="M 332 155 C 332 110, 292 85, 237 85 C 172 85, 137 125, 137 175 C 137 235, 202 255, 256 270 C 317 285, 372 310, 372 370 C 372 425, 327 455, 262 455 C 197 455, 157 425, 147 385"
          fill="none" stroke="url(#sGradPrimary)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner Harmonic Wave Ribbon -->
    <path d="M 297 175 C 297 140, 272 120, 237 120 C 197 120, 177 145, 177 175 C 177 210, 217 225, 256 238 C 302 250, 332 270, 332 320"
          fill="none" stroke="url(#sGradAccent)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

    <!-- Specular Light Sheen along the S -->
    <path d="M 262 92 C 192 92, 152 125, 152 170"
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M 357 365 C 357 410, 317 445, 262 445"
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Luminous Voice Core Sparks -->
    <circle cx="332" cy="155" r="9" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="332" cy="155" r="4.5" fill="#FFFFFF"/>
    
    <circle cx="147" cy="385" r="9" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="147" cy="385" r="4.5" fill="#FFFFFF"/>

    <!-- Central Audio Frequency Pulse Nodes -->
    <circle cx="256" cy="270" r="12" fill="#10B981" filter="url(#glow)"/>
    <circle cx="256" cy="270" r="6" fill="#FFFFFF"/>
  </g>
</svg>
